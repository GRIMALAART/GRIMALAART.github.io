<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- BALISE DE VÉRIFICATION GOOGLE -->
    <meta name="google-site-verification" content="it3rkycRf06UwCLFWmzgPoisQwQ4hQM-dgFzEMdzAhk" />
    
    <!-- DESCRIPTION POUR GOOGLE -->
    <meta name="description" content="Portfolio artistique de Noé Grimal - GRIMALAART. Créations graphiques et posters originaux.">

    <title>GRIMALAART | NOE GRIMAL</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="GRIMALAART_BLEU.svg">

    <style>
        /* --- RESET & TYPO --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- HEADER FIXE --- */
        header {
            position: fixed;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
        }

        .titles {
            font-size: clamp(2.5rem, 8vw, 8rem); 
            line-height: 0.8;
            font-weight: 700;
            letter-spacing: -0.06em;
            pointer-events: auto;
            text-transform: uppercase;
        }

        .titles a { text-decoration: none; color: inherit; }

        /* --- BOUTON ÉTOILE PLEINE (FAVORIS) --- */
        .favorite-trigger {
            position: fixed;
            bottom: 30px;
            right: 20px;
            z-index: 200;
            cursor: pointer;
            background: none;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
            padding: 0;
        }

        .favorite-trigger svg {
            width: 40px;
            height: 40px;
            fill: #000;
            stroke: none;
        }

        .favorite-trigger:hover { transform: scale(1.1); }
        .favorite-trigger:active svg { fill: #0000FF; }

        /* --- FLÈCHE D'INDICATION (ACCUEIL) --- */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            animation: bounce 2s infinite;
            transition: opacity 0.5s ease;
            background: none;
            border: none;
        }

        .indicator-arrow-icon {
            width: 30px; 
            height: 30px;
            border-right: 6px solid #000;
            border-bottom: 6px solid #000;
            transform: rotate(45deg);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-10px); }
            60% { transform: translateX(-50%) translateY(-5px); }
        }

        /* --- SIDE PANEL (FAVORIS) --- */
        #cart-panel {
            position: fixed;
            top: 0; right: -100%;
            width: 40vw;
            height: 100vh;
            background: #ffffff;
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
            z-index: 1000;
            transition: right 0.5s cubic-bezier(0.8, 0, 0.2, 1);
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        #cart-panel.open { right: 0; }

        #cart-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            z-index: 999;
            display: none;
        }

        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .cart-header h2 { font-size: 2rem; text-transform: uppercase; font-weight: 900; }
        .close-cart { font-size: 2.5rem; cursor: pointer; background: none; border: none; font-weight: 700; }

        .cart-content { flex-grow: 1; overflow-y: auto; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .cart-item-info { display: flex; align-items: center; gap: 15px; }
        .cart-thumb { width: 50px; height: 65px; object-fit: cover; background: #eee; }

        .quantity-controls { display: flex; align-items: center; gap: 15px; }
        .qty-btn {
            background: none !important; 
            border: none !important;
            font-family: inherit;
            font-size: 1.8rem;
            cursor: pointer; 
            font-weight: 900;
            color: #000;
            padding: 10px;
        }

        .cart-footer { padding-top: 20px; margin-top: 20px; }
        .checkout-btn {
            width: 100%; background: #000; color: #fff; border: none; padding: 20px;
            font-family: inherit; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; cursor: pointer;
            text-decoration: none; display: block; text-align: center;
        }

        /* --- MARQUEE --- */
        .hero { height: 100vh; display: flex; align-items: center; overflow: hidden; position: relative; }
        .marquee-track { display: flex; width: fit-content; animation: marquee-infinite 25s linear infinite; }
        .marquee-track img { width: 380px; margin-right: 15vw; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes marquee-infinite { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- PORTFOLIO --- */
        main { padding: 0 20px; }
        .work-list { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 80px; 
            margin-top: 30vh; 
            margin-bottom: 100px; 
        }
        .item { width: 100%; max-width: 800px; display: flex; flex-direction: column; }
        .img-box { width: 100%; height: auto; margin-bottom: 8px; }
        .img-box img { width: 100%; height: auto; display: block; }
        .desc { font-size: clamp(1rem, 4vw, 1.2rem); text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
        .add-btn { background: none !important; border: none !important; font-family: inherit; font-weight: 900; font-size: 2.2rem; cursor: pointer; color: #000; padding: 10px; }

        /* --- FOOTER --- */
        footer { margin-top: 100px; padding: 40px 0; text-transform: uppercase; display: flex; justify-content: space-between; align-items: flex-end; }
        .footer-left { display: flex; flex-direction: column; font-weight: 700; font-size: 0.9rem; }
        .footer-left a { text-decoration: none; color: inherit; }
        
        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            header { top: 15px; left: 15px; right: 15px; }
            .titles { font-size: 3rem; }
            #cart-panel { width: 100vw; padding: 30px 20px; }
            .marquee-track img { width: 220px; margin-right: 10vw; }
            .work-list { gap: 60px; margin-top: 20vh; }
            .item { width: 95%; }
            .indicator-arrow-icon { width: 22px; height: 22px; border-width: 4px; }
            .scroll-indicator { bottom: 20px; }
            .favorite-trigger { bottom: 20px; right: 15px; }
            .favorite-trigger svg { width: 30px; height: 30px; }
            footer { flex-direction: column; align-items: flex-start; gap: 20px; }
        }
    </style>
</head>
<body>

    <div id="cart-overlay" onclick="closeCart()"></div>

    <div id="cart-panel">
        <div class="cart-header">
            <h2>Favoris</h2>
            <button class="close-cart" onclick="closeCart()">✕</button>
        </div>
        <div class="cart-content" id="cart-items">
            <p style="text-transform:uppercase; font-style:italic; opacity:0.5;">Aucun favori pour le moment.</p>
        </div>
        <div id="cart-summary" style="display: none;">
            <div class="cart-footer">
                <a href="https://www.instagram.com/grimalaart/" target="_blank" class="checkout-btn">Aller sur @grimalaart</a>
            </div>
        </div>
    </div>

    <!-- BOUTON ÉTOILE PLEINE -->
    <button class="favorite-trigger" onclick="openCart()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L14.4 9.2H22L15.8 13.8L18.2 21L12 16.4L5.8 21L8.2 13.8L2 9.2H9.6L12 2Z" />
        </svg>
    </button>

    <header>
        <div class="titles"><a href="https://www.instagram.com/grimalaart/" target="_blank">GRIMALAART</a></div>
    </header>

    <section class="hero">
        <div class="marquee-track">
            <img src="GRIMALAART_BLEU.svg" alt="">
            <img src="GRIMALAART_BLEU.svg" alt="">
            <img src="GRIMALAART_BLEU.svg" alt="">
            <img src="GRIMALAART_BLEU.svg" alt="">
            <img src="GRIMALAART_BLEU.svg" alt="">
        </div>

        <button class="scroll-indicator" id="scrollIndicator" onclick="document.getElementById('work').scrollIntoView();">
            <div class="indicator-arrow-icon"></div>
        </button>
    </section>

    <main id="work">
        <div class="work-list"></div>

        <footer>
            <div class="footer-left">
                <span>NOÉ GRIMAL</span>
                <a href="https://www.instagram.com/grimalaart/" target="_blank">@GRIMALAART</a>
            </div>
        </footer>
    </main>

    <script>
        const PRODUITS = [
            { id: "POSTER_01", nom: "POSTER_01", image: "IMAGES/JOUR1_SUMMER - Grande.jpeg" },
            { id: "POSTER_02", nom: "POSTER_02", image: "IMAGES/JOUR2_HIVER - Grande.jpeg" },
            { id: "POSTER_03", nom: "POSTER_03", image: "IMAGES/JOUR3_SUN - Grande.jpeg" },
            { id: "POSTER_04", nom: "POSTER_04", image: "IMAGES/JOUR4_MOUNTAIN - Grande.jpeg" },
            { id: "POSTER_05", nom: "POSTER_05", image: "IMAGES/JOUR5_TIKIS - Grande.jpeg" },
            { id: "POSTER_06", nom: "POSTER_06", image: "IMAGES/JOUR6_TIKIS - Grande.jpeg" },
            { id: "POSTER_07", nom: "POSTER_07", image: "IMAGES/JOUR7_TIKIS - Grande.jpeg" },
            { id: "POSTER_08", nom: "POSTER_08", image: "IMAGES/JOUR8_TECKEL - Grande.jpeg" },
        ];

        const workList = document.querySelector('.work-list');
        PRODUITS.forEach(p => {
            workList.innerHTML += `
                <div class="item">
                    <div class="img-box"><img id="img-${p.id}" src="${p.image}" alt="${p.nom}"></div>
                    <div class="desc">
                        <span>${p.nom}</span>
                        <button class="add-btn" onclick="updateQuantity('${p.id}', 1)">+</button>
                    </div>
                </div>
            `;
        });

        window.addEventListener('scroll', () => {
            const indicator = document.getElementById('scrollIndicator');
            if (window.scrollY > 50) {
                indicator.style.opacity = '0';
                indicator.style.pointerEvents = 'none';
            } else {
                indicator.style.opacity = '1';
                indicator.style.pointerEvents = 'auto';
            }
        });

        let cart = {};

        function openCart() {
            document.getElementById('cart-panel').classList.add('open');
            document.getElementById('cart-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeCart() {
            document.getElementById('cart-panel').classList.remove('open');
            document.getElementById('cart-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function updateQuantity(id, change) {
            const prod = PRODUITS.find(p => p.id === id);
            if (cart[id]) {
                cart[id].qty += change;
            } else if (change > 0) {
                cart[id] = { nom: prod.nom, qty: 1, image: prod.image };
            }
            if (cart[id] && cart[id].qty <= 0) delete cart[id];
            renderCart();
            if (change > 0) openCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const summary = document.getElementById('cart-summary');
            const keys = Object.keys(cart);

            if (keys.length === 0) {
                container.innerHTML = '<p style="text-transform:uppercase; font-style:italic; opacity:0.5;">Aucun favori pour le moment.</p>';
                summary.style.display = 'none';
                return;
            }

            summary.style.display = 'block';
            container.innerHTML = '';

            keys.forEach(id => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div class="cart-item-info">
                        <img src="${cart[id].image}" class="cart-thumb">
                        <span>${cart[id].nom}</span>
                    </div>
                    <div class="quantity-controls">
                        <button class="qty-btn" onclick="updateQuantity('${id}', -1)">-</button>
                        <span>${cart[id].qty}</span>
                        <button class="qty-btn" onclick="updateQuantity('${id}', 1)">+</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }
    </script>
</body>
</html>
