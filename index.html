<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIMALAART | NOE GRIMAL</title>
    <style>
        /* --- RESET & TYPO --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #ffffff; color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased; overflow-x: hidden;
        }
        a, button, span, div, p, h2 { color: #000000 !important; text-decoration: none; border-radius: 0; }

        /* --- OVERLAY GLOBAL (C'EST LUI QUI FAIT LE FLOU) --- */
        #global-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.2); /* Très léger voile blanc */
            backdrop-filter: blur(15px); /* LE FLOU EST ICI */
            -webkit-backdrop-filter: blur(15px);
            z-index: 999; display: none;
        }

        /* --- PANNEAUX (ILS DEVIENNENT TOTALEMENT TRANSPARENTS) --- */
        #menu-panel, #cart-panel {
            position: fixed; top: 0; height: 100vh; z-index: 1000;
            display: flex; flex-direction: column;
            transition: all 0.5s cubic-bezier(0.8, 0, 0.2, 1);
            background: transparent; /* PLUS DE RECTANGLE BLANC */
            backdrop-filter: none; /* PLUS DE FLOU ICI POUR ÉVITER LA LIGNE NETTE */
            -webkit-backdrop-filter: none;
        }
        #menu-panel { left: -100%; width: 850px; padding: 40px; justify-content: center; }
        #cart-panel { right: -100%; width: 40vw; padding: 40px; }
        #menu-panel.open { left: 0; }
        #cart-panel.open { right: 0; }

        /* --- BOUTONS & LÉGENDES --- */
        .titles { position: fixed; top: 20px; left: 20px; font-size: clamp(2.5rem, 8vw, 8rem); line-height: 0.8; font-weight: 700; text-transform: uppercase; z-index: 100; pointer-events: auto; }
        .menu-trigger { position: fixed; bottom: 30px; left: 20px; z-index: 2001; cursor: pointer; background: none; border: none; display: flex; flex-direction: column; gap: 6px; padding: 10px; }
        .menu-trigger span { width: 30px; height: 3px; background: #000000 !important; }
        .favorite-trigger { position: fixed; bottom: 30px; right: 20px; z-index: 2001; cursor: pointer; background: none; border: none; padding: 10px; }
        .favorite-trigger svg { width: 40px; height: 40px; fill: #000000 !important; }

        .cat-link { background: none; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; font-size: clamp(2.5rem, 6vw, 4.5rem); line-height: 0.55; opacity: 0.2; transition: 0.2s; padding: 8px 0; }
        .cat-link.active, .cat-link:hover { opacity: 1; }

        /* --- MARQUEE --- */
        .hero { height: 100vh; display: flex; align-items: center; overflow: hidden; }
        .marquee-track { display: flex; width: max-content; animation: marquee-infinite 25s linear infinite; }
        .marquee-track img { height: 250px; width: auto; margin-right: 15vw; flex-shrink: 0; }
        @keyframes marquee-infinite { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- WORK LIST (COLLÉ ET GRAND) --- */
        .work-list { display: flex; flex-direction: column; align-items: center; gap: 120px; margin-top: 10vh; margin-bottom: 100px; padding: 0 20px; }
        .item { width: 100%; max-width: 300px; }
        .img-box { line-height: 0; }
        .img-box img { width: 100%; height: auto; cursor: zoom-in; }
        .desc { font-size: 1rem; text-transform: uppercase; display: flex; justify-content: space-between; align-items: flex-start; font-weight: 700; line-height: 1; padding-top: 4px; position: relative; top: -2px; }
        .add-btn { background: none; border: none; font-weight: 900; font-size: 1.8rem; cursor: pointer; margin-left: 15px; line-height: 0.7; height: 1rem; display: flex; align-items: center; flex-shrink: 0; }

        @media (max-width: 768px) {
            #menu-panel, #cart-panel { width: 100vw; }
            .cat-link { font-size: 2.8rem; }
            .marquee-track img { height: 150px; }
        }
    </style>
</head>
<body>
    <div id="global-overlay" onclick="closeAll()"></div>
    <button class="menu-trigger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
    <button class="favorite-trigger" onclick="toggleCart()"><svg viewBox="0 0 24 24"><path d="M12 2L14.4 9.2H22L15.8 13.8L18.2 21L12 16.4L5.8 21L8.2 13.8L2 9.2H9.6L12 2Z"/></svg></button>

    <div id="menu-panel">
        <button class="cat-link active" onclick="filtrer('TOUT')">TOUT</button>
        <button class="cat-link" onclick="filtrer('AFFICHES')">AFFICHES</button>
        <button class="cat-link" onclick="filtrer('PEINTURES')">PEINTURES</button>
        <button class="cat-link" onclick="filtrer('OBJETS')">OBJETS</button>
        <button class="cat-link" onclick="filtrer('LOGOS')">LOGOS</button>
        <button class="cat-link" onclick="filtrer('ARCHITECTURE')">ARCHITECTURE</button>
        <button class="cat-link" onclick="filtrer('ILLUSTRATIONS')">ILLUSTRATIONS</button>
        <button class="cat-link" onclick="filtrer('PHOTOGRAPHIES')">PHOTOGRAPHIES</button>
    </div>

    <div id="cart-panel">
        <h2 style="text-transform:uppercase; font-weight:900; margin-bottom: 40px;">Favoris</h2>
        <div id="cart-items"></div>
    </div>

    <header><div class="titles"><a onclick="goHome()">GRIMALAART</a></div></header>
    <section class="hero"><div class="marquee-track"><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""></div></section>
    <main id="work"><div class="work-list"></div></main>

    <script>
        const PRODUITS = [
            { id: "P1", nom: "POSTER_01", image: "IMAGES/AFFICHES/JOUR1_SUMMER - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P9", nom: "L'HOMME À LA TONDEUSE ET LA FILLE À LA RAQUETTE", image: "IMAGES/PEINTURES/TONDEUSE.jpg", categorie: "PEINTURES" },
            { id: "P15", nom: "BOX TO BOX", image: "IMAGES/ARCHITECTURE/BOX TO BOX.jpeg", categorie: "ARCHITECTURE" }
            /* Ajoute le reste de tes produits ici */
        ];

        function toggleMenu() {
            const panel = document.getElementById('menu-panel');
            const overlay = document.getElementById('global-overlay');
            if (panel.classList.contains('open')) { closeAll(); } 
            else { closeAll(); panel.classList.add('open'); overlay.style.display = 'block'; }
        }

        function toggleCart() {
            const panel = document.getElementById('cart-panel');
            const overlay = document.getElementById('global-overlay');
            if (panel.classList.contains('open')) { closeAll(); } 
            else { closeAll(); panel.classList.add('open'); overlay.style.display = 'block'; }
        }

        function closeAll() {
            document.getElementById('menu-panel').classList.remove('open');
            document.getElementById('cart-panel').classList.remove('open');
            document.getElementById('global-overlay').style.display = 'none';
        }

        function afficherProduits(filtre = 'TOUT') {
            const list = document.querySelector('.work-list');
            list.innerHTML = '';
            const items = filtre === 'TOUT' ? PRODUITS : PRODUITS.filter(p => p.categorie === filtre);
            items.forEach(p => {
                list.innerHTML += `<div class="item">
                    <div class="img-box"><img src="${p.image}" alt="${p.nom}"></div>
                    <div class="desc"><span>${p.nom}</span><button class="add-btn">+</button></div>
                </div>`;
            });
        }

        function filtrer(cat) {
            afficherProduits(cat); closeAll();
            document.querySelectorAll('.cat-link').forEach(btn => btn.classList.toggle('active', btn.innerText === cat));
        }

        afficherProduits();
        function goHome() { window.scrollTo({top: 0, behavior: 'smooth'}); }
    </script>
</body>
</html>
