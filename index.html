<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="google-site-verification" content="it3rkycRf06UwCLFWmzgPoisQwQ4hQM-dgFzEMdzAhk" />
    
    <meta name="description" content="Portfolio artistique de Noé Grimal - GRIMALAART. Créations graphiques et posters originaux.">

    <title>GRIMALAART | NOE GRIMAL</title>
    
    <link rel="icon" type="image/svg+xml" href="GRIMALAART_BLEU.svg">

    <style>
        /* --- RESET & TYPO --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- HEADER FIXE --- */
        header {
            position: fixed;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
        }

        .titles {
            font-size: clamp(2.5rem, 8vw, 8rem); 
            line-height: 0.8;
            font-weight: 700;
            letter-spacing: -0.06em;
            pointer-events: auto;
            text-transform: uppercase;
        }

        .titles a { text-decoration: none; color: inherit; cursor: pointer; }

        /* --- MODAL FULLSCREEN --- */
        #fullscreen-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        #fullscreen-overlay img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }

        /* --- BOUTON MENU BURGER (PERSISTANT) --- */
        .menu-trigger {
            position: fixed;
            bottom: 30px;
            left: 20px;
            z-index: 2001; /* Doit être au-dessus du panneau */
            cursor: pointer;
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
            padding: 10px;
        }

        .menu-trigger span {
            width: 30px; height: 3px;
            background: #000;
            transition: 0.3s;
        }

        /* --- BOUTON ÉTOILE (PERSISTANT) --- */
        .favorite-trigger {
            position: fixed;
            bottom: 30px; right: 20px;
            z-index: 2001; /* Doit être au-dessus du panneau */
            cursor: pointer;
            background: none; border: none;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s ease;
            padding: 10px;
            pointer-events: auto;
        }

        .favorite-trigger svg { width: 40px; height: 40px; fill: #000; }

        /* --- PANNEAUX (GAUCHE & DROITE) --- */
        #menu-panel, #cart-panel {
            position: fixed;
            top: 0;
            height: 100vh;
            background: #ffffff;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.05);
            transition: all 0.5s cubic-bezier(0.8, 0, 0.2, 1);
        }

        #menu-panel { left: -100%; width: 850px; padding: 40px; justify-content: center; }
        #cart-panel { right: -100%; width: 40vw; padding: 40px; }

        #menu-panel.open { left: 0; }
        #cart-panel.open { right: 0; }

        /* --- STYLE DES LIENS MENU --- */
        .cat-link {
            background: none; border: none;
            font-family: inherit; 
            font-weight: 900;
            text-transform: uppercase; 
            cursor: pointer;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            text-align: left;
            line-height: 0.6; 
            letter-spacing: -0.07em;
            opacity: 0.2; 
            transition: 0.2s;
            padding: 20px 0;
            white-space: nowrap;
        }

        .cat-link.active, .cat-link:hover { opacity: 1; }

        /* --- OVERLAY GLOBAL --- */
        #global-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(5px);
            z-index: 999;
            display: none;
        }

        /* --- MARQUEE & WORK LIST --- */
        .hero { height: 100vh; display: flex; align-items: center; overflow: hidden; position: relative; }
        .marquee-track { display: flex; width: fit-content; animation: marquee-infinite 25s linear infinite; }
        .marquee-track img { width: 380px; margin-right: 15vw; }
        @keyframes marquee-infinite { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        main { padding: 0 20px; }
        .work-list { display: flex; flex-direction: column; align-items: center; gap: 80px; margin-top: 10vh; margin-bottom: 100px; }
        .item { width: 100%; max-width: 800px; }
        .img-box { cursor: zoom-in; }
        .img-box img { width: 100%; height: auto; display: block; margin-bottom: 8px; transition: opacity 0.3s; }
        .desc { font-size: 1.2rem; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
        .add-btn { background: none; border: none; font-weight: 900; font-size: 2.2rem; cursor: pointer; padding: 10px; }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .titles { font-size: 3rem; }
            #menu-panel, #cart-panel { width: 100vw; }
            .cat-link { font-size: 3.2rem; white-space: normal; line-height: 0.7; }
        }
    </style>
</head>
<body>

    <div id="global-overlay" onclick="closeAll()"></div>

    <div id="fullscreen-overlay" onclick="this.style.display='none'">
        <img id="fullscreen-img" src="" alt="Aperçu">
    </div>

    <button class="menu-trigger" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </button>

    <button class="favorite-trigger" onclick="toggleCart()">
        <svg viewBox="0 0 24 24"><path d="M12 2L14.4 9.2H22L15.8 13.8L18.2 21L12 16.4L5.8 21L8.2 13.8L2 9.2H9.6L12 2Z"/></svg>
    </button>

    <div id="menu-panel">
        <button class="cat-link active" onclick="filtrer('TOUT')">TOUT</button>
        <button class="cat-link" onclick="filtrer('AFFICHES')">AFFICHES</button>
        <button class="cat-link" onclick="filtrer('PEINTURES')">PEINTURES</button>
        <button class="cat-link" onclick="filtrer('OBJETS')">OBJETS</button>
        <button class="cat-link" onclick="filtrer('LOGOS')">LOGOS</button>
        <button class="cat-link" onclick="filtrer('PHOTOGRAPHIES')">PHOTOGRAPHIES</button>
    </div>

    <div id="cart-panel">
        <h2 style="text-transform:uppercase; font-weight:900; margin-bottom: 40px;">Favoris</h2>
        <div id="cart-items"></div>
        <div id="cart-summary" style="display:none; margin-top:20px;">
            <a href="https://www.instagram.com/grimalaart/" target="_blank" style="display:block; background:#000; color:#fff; text-align:center; padding:20px; text-decoration:none; font-weight:900; text-transform:uppercase;">Contact Instagram</a>
        </div>
    </div>

    <header>
        <div class="titles"><a onclick="goHome()">GRIMALAART</a></div>
    </header>

    <section class="hero">
        <div class="marquee-track">
            <img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt="">
        </div>
    </section>

    <main id="work">
        <div class="work-list"></div>
    </main>

    <script>
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }

        const PRODUITS = [
            { id: "P1", nom: "POSTER_01", image: "IMAGES/JOUR1_SUMMER - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P2", nom: "POSTER_02", image: "IMAGES/JOUR2_HIVER - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P3", nom: "POSTER_03", image: "IMAGES/JOUR3_SUN - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P4", nom: "POSTER_04", image: "IMAGES/JOUR4_MOUNTAIN - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P5", nom: "POSTER_05", image: "IMAGES/JOUR5_TIKIS - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P6", nom: "POSTER_06", image: "IMAGES/JOUR6_TIKIS - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P7", nom: "POSTER_07", image: "IMAGES/JOUR7_TIKIS - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P8", nom: "POSTER_08", image: "IMAGES/JOUR8_TECKEL - Grande.jpeg", categorie: "AFFICHES" }
        ];

        function goHome() { window.scrollTo({top: 0, behavior: 'smooth'}); }

        // Fonction Toggle pour le menu
        function toggleMenu() {
            const panel = document.getElementById('menu-panel');
            const cartPanel = document.getElementById('cart-panel');
            if (panel.classList.contains('open')) {
                closeAll();
            } else {
                closeAll(); // Ferme les autres avant d'ouvrir
                panel.classList.add('open');
                document.getElementById('global-overlay').style.display = 'block';
            }
        }

        // Fonction Toggle pour les favoris
        function toggleCart() {
            const panel = document.getElementById('cart-panel');
            if (panel.classList.contains('open')) {
                closeAll();
            } else {
                closeAll(); // Ferme les autres avant d'ouvrir
                panel.classList.add('open');
                document.getElementById('global-overlay').style.display = 'block';
            }
        }

        function closeAll() {
            document.getElementById('menu-panel').classList.remove('open');
            document.getElementById('cart-panel').classList.remove('open');
            document.getElementById('global-overlay').style.display = 'none';
        }

        function openFullscreen(src) {
            const overlay = document.getElementById('fullscreen-overlay');
            document.getElementById('fullscreen-img').src = src;
            overlay.style.display = 'flex';
        }

        function afficherProduits(filtre = 'TOUT') {
            const list = document.querySelector('.work-list');
            list.innerHTML = '';
            const items = filtre === 'TOUT' ? PRODUITS : PRODUITS.filter(p => p.categorie === filtre);
            items.forEach(p => {
                list.innerHTML += `
                    <div class="item">
                        <div class="img-box" onclick="openFullscreen('${p.image}')"><img src="${p.image}" alt="${p.nom}"></div>
                        <div class="desc"><span>${p.nom}</span><button class="add-btn" onclick="event.stopPropagation(); updateQuantity('${p.id}', 1)">+</button></div>
                    </div>`;
            });
        }

        function filtrer(cat) {
            afficherProduits(cat);
            closeAll();
            document.querySelectorAll('.cat-link').forEach(btn => btn.classList.toggle('active', btn.innerText === cat));
            window.scrollTo({top: window.innerHeight, behavior: 'smooth'});
        }

        let cart = {};
        function updateQuantity(id, change) {
            const p = PRODUITS.find(i => i.id === id);
            if(cart[id]) cart[id].qty += change;
            else if(change > 0) cart[id] = {nom: p.nom, qty: 1, image: p.image};
            if(cart[id] && cart[id].qty <= 0) delete cart[id];
            renderCart();
            if(change > 0) { closeAll(); document.getElementById('cart-panel').classList.add('open'); document.getElementById('global-overlay').style.display = 'block'; }
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const keys = Object.keys(cart);
            container.innerHTML = keys.length ? '' : '<p style="opacity:0.5; font-style:italic;">Votre liste est vide.</p>';
            keys.forEach(id => {
                container.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-weight:700; text-transform:uppercase; font-size:0.8rem;">
                    <div style="display:flex; align-items:center; gap:10px;"><img src="${cart[id].image}" style="width:40px; height:50px; object-fit:cover;"><span>${cart[id].nom}</span></div>
                    <div><button onclick="updateQuantity('${id}', -1)" style="border:none; background:none; font-size:1.5rem; cursor:pointer; padding:5px;">-</button> ${cart[id].qty} <button onclick="updateQuantity('${id}', 1)" style="border:none; background:none; font-size:1.5rem; cursor:pointer; padding:5px;">+</button></div>
                </div>`;
            });
            document.getElementById('cart-summary').style.display = keys.length ? 'block' : 'none';
        }

        afficherProduits();
    </script>
</body>
</html>
