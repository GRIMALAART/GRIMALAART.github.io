<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="google-site-verification" content="it3rkycRf06UwCLFWmzgPoisQwQ4hQM-dgFzEMdzAhk" />
    
    <meta name="description" content="Portfolio artistique de Noé Grimal - GRIMALAART. Créations graphiques et posters originaux.">

    <title>GRIMALAART | NOE GRIMAL</title>
    
    <link rel="icon" type="image/svg+xml" href="GRIMALAART_BLEU.svg">

    <style>
        /* --- RESET & TYPO --- */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
        
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* FORCE LE NOIR SUR TOUT */
        a, button, span, div, p, h2, .cat-link, .add-btn, .qty-btn {
            color: #000000 !important;
            text-decoration: none;
            -webkit-appearance: none;
            border-radius: 0;
        }

        /* --- HEADER FIXE --- */
        header {
            position: fixed;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
        }

        .titles {
            font-size: clamp(2.5rem, 8vw, 8rem); 
            line-height: 0.8;
            font-weight: 700;
            letter-spacing: -0.06em;
            pointer-events: auto;
            text-transform: uppercase;
        }

        .titles a { color: #000000 !important; }

        /* --- MODAL FULLSCREEN --- */
        #fullscreen-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        #fullscreen-overlay img { 
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
        }

        /* --- BOUTONS PERSISTANTS --- */
        .menu-trigger {
            position: fixed;
            bottom: 30px;
            left: 20px;
            z-index: 2001;
            cursor: pointer;
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
            padding: 10px;
        }

        .menu-trigger span {
            width: 30px; height: 3px;
            background: #000000 !important;
            transition: 0.3s;
        }

        .favorite-trigger {
            position: fixed;
            bottom: 30px; right: 20px;
            z-index: 2001;
            cursor: pointer;
            background: none; border: none;
            display: flex; justify-content: center; align-items: center;
            padding: 10px;
            pointer-events: auto;
        }

        .favorite-trigger svg { width: 40px; height: 40px; fill: #000000 !important; }

        /* --- PANNEAUX --- */
        #menu-panel, #cart-panel {
            position: fixed;
            top: 0;
            height: 100vh;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: all 0.5s cubic-bezier(0.8, 0, 0.2, 1);
            overflow-x: hidden;
            background: #ffffff;
        }

        #menu-panel { left: -100%; width: 850px; padding: 40px; justify-content: center; }
        #cart-panel { right: -100%; width: 40vw; padding: 40px; }

        #menu-panel.open { left: 0; }
        #cart-panel.open { right: 0; }

        .cat-link {
            background: none; border: none;
            font-family: inherit; 
            font-weight: 900;
            text-transform: uppercase; 
            cursor: pointer;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            text-align: left;
            line-height: 0.55; 
            letter-spacing: -0.07em;
            opacity: 0.2; 
            transition: 0.2s;
            padding: 8px 0;
            white-space: nowrap;
        }

        .cat-link.active, .cat-link:hover { opacity: 1; color: #000000 !important; }

        #global-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(5px);
            z-index: 999;
            display: none;
        }

        /* --- MARQUEE & WORK LIST --- */
        .hero { height: 100vh; display: flex; align-items: center; overflow: hidden; position: relative; }
        .marquee-track { display: flex; width: fit-content; animation: marquee-infinite 25s linear infinite; }
        .marquee-track img { width: 380px; margin-right: 15vw; }
        @keyframes marquee-infinite { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        main { padding: 0 20px; }
        
        .work-list { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 100px; 
            margin-top: 10vh; 
            margin-bottom: 100px; 
        }
        
        /* CONFIGURATION ITEM POUR COLLER LÉGENDE */
        .item { 
            width: 100%; 
            max-width: 300px; 
            display: flex;
            flex-direction: column;
        }

        .img-box {
            line-height: 0; /* Supprime l'espace résiduel sous l'image */
        }

        .img-box img { 
            width: 100%; 
            height: auto; 
            display: block; 
            margin-bottom: 0; 
            cursor: zoom-in; 
        }
        
        .desc { 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: 700; 
            line-height: 0.85; /* INTERLIGNAGE SERRÉ */
            margin-top: -2px; /* COLLE À L'IMAGE */
            padding-top: 5px; 
            color: #000000 !important; 
        }
        
        .add-btn { background: none; border: none; font-weight: 900; font-size: 1.8rem; cursor: pointer; padding: 5px; color: #000000 !important; }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .titles { font-size: 3rem; }
            #menu-panel, #cart-panel { width: 100vw; }
            .cat-link { font-size: 2.8rem; line-height: 0.55; padding: 12px 0; white-space: nowrap; }
            #menu-panel { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="global-overlay" onclick="closeAll()"></div>

    <div id="fullscreen-overlay" onclick="this.style.display='none'">
        <img id="fullscreen-img" src="" alt="Aperçu">
    </div>

    <button class="menu-trigger" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </button>

    <button class="favorite-trigger" onclick="toggleCart()">
        <svg viewBox="0 0 24 24"><path d="M12 2L14.4 9.2H22L15.8 13.8L18.2 21L12 16.4L5.8 21L8.2 13.8L2 9.2H9.6L12 2Z"/></svg>
    </button>

    <div id="menu-panel">
        <button class="cat-link active" onclick="filtrer('TOUT')">TOUT</button>
        <button class="cat-link" onclick="filtrer('AFFICHES')">AFFICHES</button>
        <button class="cat-link" onclick="filtrer('PEINTURES')">PEINTURES</button>
        <button class="cat-link" onclick="filtrer('OBJETS')">OBJETS</button>
        <button class="cat-link" onclick="filtrer('LOGOS')">LOGOS</button>
        <button class="cat-link" onclick="filtrer('ARCHITECTURE')">ARCHITECTURE</button>
        <button class="cat-link" onclick="filtrer('ILLUSTRATIONS')">ILLUSTRATIONS</button>
        <button class="cat-link" onclick="filtrer('PHOTOGRAPHIES')">PHOTOGRAPHIES</button>
    </div>

    <div id="cart-panel">
        <h2 style="text-transform:uppercase; font-weight:900; margin-bottom: 40px;">Favoris</h2>
        <div id="cart-items"></div>
        <div id="cart-summary" style="display:none; margin-top:20px;">
            <a href="https://www.instagram.com/grimalaart/" target="_blank" class="checkout-btn" style="display:block; background:#000; color:#fff !important; text-align:center; padding:20px; text-decoration:none; font-weight:900; text-transform:uppercase;">Contact Instagram</a>
        </div>
    </div>

    <header>
        <div class="titles"><a onclick="goHome()">GRIMALAART</a></div>
    </header>

    <section class="hero">
        <div class="marquee-track">
            <img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt=""><img src="GRIMALAART_BLEU.svg" alt="">
        </div>
    </section>

    <main id="work">
        <div class="work-list"></div>
    </main>

    <script>
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }

        const PRODUITS = [
            { id: "P1", nom: "POSTER_01", image: "IMAGES/AFFICHES/JOUR1_SUMMER - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P2", nom: "POSTER_02", image: "IMAGES/AFFICHES/JOUR2_HIVER - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P3", nom: "POSTER_03", image: "IMAGES/AFFICHES/JOUR3_SUN - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P4", nom: "POSTER_04", image: "IMAGES/AFFICHES/JOUR4_MOUNTAIN - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P5", nom: "POSTER_05", image: "IMAGES/AFFICHES/JOUR5_TIKIS - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P6", nom: "POSTER_06", image: "IMAGES/AFFICHES/JOUR6_TIKIS - Grande.jpeg", categorie: "AFFICHES" },

            { id: "P8", nom: "POSTER_08", image: "IMAGES/AFFICHES/JOUR8_TECKEL - Grande.jpeg", categorie: "AFFICHES" },
            { id: "P9", nom: "L'HOMME À LA TONDEUSE ET LA FILLE À LA RAQUETTE", image: "IMAGES/PEINTURES/TONDEUSE.jpg", categorie: "PEINTURES" },

            { id: "P15", nom: "BOX TO BOX", image: "IMAGES/ARCHITECTURE/BOX TO BOX.jpeg", categorie: "ARCHITECTURE" },

            { id: "P17", nom: "CARTE SARDAIGNE", image: "IMAGES/ARCHITECTURE/CARTE SARDAIGNE.jpeg", categorie: "ARCHITECTURE" },
            { id: "P18", nom: "ESADHAR", image: "IMAGES/ARCHITECTURE/ESADHAR.jpeg", categorie: "ARCHITECTURE" },
            { id: "P19", nom: "MOSCHEA DI CORDOBA", image: "IMAGES/ARCHITECTURE/MOSCHEA DI CORDOBA.jpeg", categorie: "ARCHITECTURE" },
            { id: "P20", nom: "MOTEUR AÉRONAUTIQUE", image: "IMAGES/ARCHITECTURE/MOTEUR AERONAUTIQUE.jpeg", categorie: "ARCHITECTURE" },
            { id: "P21", nom: "PERSPECTIVE ESADHAR_1", image: "IMAGES/ARCHITECTURE/PERSPECTIVE ESADHAR_1.jpeg", categorie: "ARCHITECTURE" },
            { id: "P22", nom: "PERSPECTIVE ESADHAR_2", image: "IMAGES/ARCHITECTURE/PERSPECTIVE ESADHAR_2.jpeg", categorie: "ARCHITECTURE" },
            { id: "P23", nom: "PERSPECTIVE ESADHAR_3", image: "IMAGES/ARCHITECTURE/PERSPECTIVE ESADHAR_3.jpeg", categorie: "ARCHITECTURE" },
            { id: "P24", nom: "PERSPECTIVE MONTEPONI, SARDAIGNE", image: "IMAGES/ARCHITECTURE/PERSPECTIVE MONTEPONI, SARDAIGNE.jpeg", categorie: "ARCHITECTURE" },
            { id: "P25", nom: "TRANSFERT, NANTES", image: "IMAGES/ARCHITECTURE/TRANSFERT, NANTES.jpeg", categorie: "ARCHITECTURE" },
            { id: "P26", nom: "WORKSHOP ZIGZAG", image: "IMAGES/ARCHITECTURE/WORKSHOP ZIGZAG.jpeg", categorie: "ARCHITECTURE" },
            { id: "P27", nom: "CROCO", image: "IMAGES/ILLUSTRATIONS/CROCO.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P28", nom: "ELEFANT", image: "IMAGES/ILLUSTRATIONS/ELEFANT.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P29", nom: "FLAMINGO", image: "IMAGES/ILLUSTRATIONS/FLAMINGO.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P30", nom: "GIRAFE", image: "IMAGES/ILLUSTRATIONS/GIRAFE.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P31", nom: "HOMARD", image: "IMAGES/ILLUSTRATIONS/HOMARD.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P32", nom: "KIKI", image: "IMAGES/ILLUSTRATIONS/KIKI.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P33", nom: "BELLA E BIANCA", image: "IMAGES/ILLUSTRATIONS/OLD BEACHES.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P34", nom: "OTARIE", image: "IMAGES/ILLUSTRATIONS/OTARIE.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P35", nom: "STICKER_01", image: "IMAGES/ILLUSTRATIONS/STICKER_01.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P36", nom: "TIKI BLEU", image: "IMAGES/ILLUSTRATIONS/TIKI BLEU.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P37", nom: "TIKI ROUGE", image: "IMAGES/ILLUSTRATIONS/TIKI ROUGE.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P38", nom: "TIKI VERT", image: "IMAGES/ILLUSTRATIONS/TIKI VERT.jpeg", categorie: "ILLUSTRATIONS" },
            { id: "P39", nom: "AU-DELÀ", image: "IMAGES/AFFICHES/AU-DELÀ.jpeg", categorie: "AFFICHES" },
            { id: "P40", nom: "FRAGMENTS DE NOUS", image: "IMAGES/AFFICHES/FRAGMENTS DE NOUS.jpg", categorie: "AFFICHES" },
            { id: "P41", nom: "INTRA-MUROS", image: "IMAGES/AFFICHES/INTRA-MUROS.jpeg", categorie: "AFFICHES" },
            { id: "P42", nom: "JO 2028", image: "IMAGES/AFFICHES/JO 2028.jpeg", categorie: "AFFICHES" }
        ];

        function toggleMenu() {
            const panel = document.getElementById('menu-panel');
            if (panel.classList.contains('open')) { closeAll(); } 
            else { closeAll(); panel.classList.add('open'); document.getElementById('global-overlay').style.display = 'block'; }
        }

        function toggleCart() {
            const panel = document.getElementById('cart-panel');
            if (panel.classList.contains('open')) { closeAll(); } 
            else { closeAll(); panel.classList.add('open'); document.getElementById('global-overlay').style.display = 'block'; }
        }

        function closeAll() {
            document.getElementById('menu-panel').classList.remove('open');
            document.getElementById('cart-panel').classList.remove('open');
            document.getElementById('global-overlay').style.display = 'none';
        }

        function openFullscreen(src) {
            const overlay = document.getElementById('fullscreen-overlay');
            document.getElementById('fullscreen-img').src = src;
            overlay.style.display = 'flex';
        }

        function afficherProduits(filtre = 'TOUT') {
            const list = document.querySelector('.work-list');
            list.innerHTML = '';
            const items = filtre === 'TOUT' ? PRODUITS : PRODUITS.filter(p => p.categorie === filtre);
            items.forEach(p => {
                list.innerHTML += `
                    <div class="item">
                        <div class="img-box" onclick="openFullscreen('${p.image}')"><img src="${p.image}" alt="${p.nom}"></div>
                        <div class="desc"><span>${p.nom}</span><button class="add-btn" onclick="event.stopPropagation(); updateQuantity('${p.id}', 1)">+</button></div>
                    </div>`;
            });
        }

        function filtrer(cat) {
            afficherProduits(cat);
            closeAll();
            document.querySelectorAll('.cat-link').forEach(btn => btn.classList.toggle('active', btn.innerText === cat));
            window.scrollTo({top: window.innerHeight, behavior: 'smooth'});
        }

        let cart = {};
        function updateQuantity(id, change) {
            const p = PRODUITS.find(i => i.id === id);
            if(cart[id]) cart[id].qty += change;
            else if(change > 0) cart[id] = {nom: p.nom, qty: 1, image: p.image};
            if(cart[id] && cart[id].qty <= 0) delete cart[id];
            renderCart();
            if(change > 0) { 
                closeAll(); 
                document.getElementById('cart-panel').classList.add('open'); 
                document.getElementById('global-overlay').style.display = 'block'; 
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const keys = Object.keys(cart);
            container.innerHTML = keys.length ? '' : '<p style="opacity:0.5; font-style:italic; color:#000;">Votre liste est vide.</p>';
            keys.forEach(id => {
                container.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-weight:700; text-transform:uppercase; font-size:0.8rem; color:#000;">
                    <div style="display:flex; align-items:center; gap:10px;"><img src="${cart[id].image}" style="width:40px; height:50px; object-fit:cover;"><span>${cart[id].nom}</span></div>
                    <div><button onclick="updateQuantity('${id}', -1)" style="border:none; background:none; font-size:1.5rem; cursor:pointer; padding:5px; color:#000;">-</button> ${cart[id].qty} <button onclick="updateQuantity('${id}', 1)" style="border:none; background:none; font-size:1.5rem; cursor:pointer; padding:5px; color:#000;">+</button></div>
                </div>`;
            });
            document.getElementById('cart-summary').style.display = keys.length ? 'block' : 'none';
        }

        afficherProduits();
        function goHome() { window.scrollTo({top: 0, behavior: 'smooth'}); }
    </script>
</body>
</html>
