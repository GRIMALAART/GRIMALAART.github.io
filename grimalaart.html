<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIMALAART | NOE GRIMAL</title>
    <style>
        /* --- RESET & TYPO --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- HEADER FIXE --- */
        header {
            position: fixed;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
        }

        .titles {
            font-size: clamp(3rem, 9vw, 8rem); 
            line-height: 0.8;
            font-weight: 700;
            letter-spacing: -0.06em;
            pointer-events: auto;
            text-transform: uppercase;
        }

        .titles a { text-decoration: none; color: inherit; }

        nav a {
            text-decoration: none;
            color: #000;
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            font-style: normal !important; 
            pointer-events: auto;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
        }

        /* --- SIDE PANEL (PANIER) --- */
        #cart-panel {
            position: fixed;
            top: 0; right: -100%;
            width: clamp(320px, 45vw, 550px);
            height: 100vh;
            background: #ffffff;
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
            z-index: 1000;
            transition: right 0.5s cubic-bezier(0.8, 0, 0.2, 1);
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        #cart-panel.open { right: 0; }

        #cart-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            z-index: 999;
            display: none;
        }

        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .cart-header h2 { font-size: 2rem; text-transform: uppercase; font-weight: 900; }
        .close-cart { font-size: 2rem; cursor: pointer; background: none; border: none; font-weight: 700; }

        .cart-content { flex-grow: 1; overflow-y: auto; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .cart-item-info { display: flex; align-items: center; gap: 15px; }
        .cart-thumb { width: 50px; height: 65px; object-fit: cover; background: #eee; }
        .cart-item-details { display: flex; flex-direction: column; }
        .format-label { font-size: 0.7rem; opacity: 0.5; font-weight: 400; margin-top: 2px; }

        .quantity-controls { display: flex; align-items: center; gap: 15px; }
        .qty-btn {
            background: none !important; 
            border: none !important;
            font-family: inherit;
            font-size: 1.5rem;
            cursor: pointer; 
            font-weight: 900;
            color: #000;
            transition: color 0.1s;
        }
        .qty-btn:active { color: #0000FF !important; }

        .cart-footer { border-top: 2px solid #000; padding-top: 20px; margin-top: 20px; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; }
        .checkout-btn {
            width: 100%; background: #000; color: #fff; border: none; padding: 20px;
            font-family: inherit; font-weight: 900; font-size: 1.2rem; text-transform: uppercase; cursor: pointer;
        }
        .checkout-btn:hover { background: #0000FF; }

        /* --- MARQUEE --- */
        .hero { height: 100vh; display: flex; align-items: center; overflow: hidden; }
        .marquee-track { display: flex; width: fit-content; animation: marquee-infinite 25s linear infinite; }
        .marquee-track img { width: 380px; margin-right: 15vw; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .marquee-track img:hover { transform: scale(1.1); }
        @keyframes marquee-infinite { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- PORTFOLIO --- */
        main { padding: 20px; }
        .work-list { display: flex; flex-direction: column; align-items: center; gap: 120px; margin-top: 60vh; margin-bottom: 150px; }
        .item { width: auto; max-width: 100%; display: flex; flex-direction: column; }
        .img-box { height: 80vh; margin-bottom: 15px; }
        .img-box img { height: 100%; display: block; }
        
        .desc { font-size: 1.2rem; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
        .product-info { display: flex; flex-direction: column; }
        .product-meta { font-size: 0.8rem; font-weight: 400; opacity: 0.6; margin-top: 4px; display: flex; gap: 10px; }
        
        .add-btn {
            background: none !important; 
            border: none !important;
            font-family: inherit; 
            font-weight: 900;
            font-size: 2rem; 
            cursor: pointer; 
            color: #000;
            margin-left: 20px;
            transition: color 0.1s;
        }
        .add-btn:active { color: #0000FF !important; }

        /* --- FOOTER --- */
        footer { margin-top: 150px; padding: 40px 0; text-transform: uppercase; display: flex; justify-content: space-between; align-items: flex-end; }
        .footer-left { display: flex; flex-direction: column; font-weight: 700; }
        .footer-left a { text-decoration: none; color: inherit; }
        .footer-left a:hover { color: #0000FF; }

        .back-to-top { position: fixed; bottom: 40px; right: 40px; z-index: 200; cursor: pointer; background: none; border: none; }
        .arrow-icon { width: 30px; height: 30px; border-top: 6px solid #000; border-left: 6px solid #000; transform: rotate(45deg); }

        @media (max-width: 768px) {
            .titles { font-size: 3.5rem; }
            #cart-panel { width: 100vw; }
            .img-box { height: 60vh; }
        }
    </style>
</head>
<body>

    <div id="cart-overlay" onclick="closeCart()"></div>

    <div id="cart-panel">
        <div class="cart-header">
            <h2>Panier</h2>
            <button class="close-cart" onclick="closeCart()">✕</button>
        </div>
        <div class="cart-content" id="cart-items">
            <p style="text-transform:uppercase; font-style:italic; opacity:0.5;">Votre sélection est vide.</p>
        </div>
        <div id="cart-summary" style="display: none;">
            <div class="cart-footer">
                <div class="total-row"><span>Total</span><span id="cart-total-value">0€</span></div>
                <button class="checkout-btn">Passer au paiement</button>
            </div>
        </div>
    </div>

    <button class="back-to-top" onclick="window.scrollTo(0, 0);"><div class="arrow-icon"></div></button>

    <header>
        <div class="titles"><a href="https://www.instagram.com/grimalaart/" target="_blank">GRIMALAART</a></div>
        <nav><a onclick="openCart()">Panier</a></nav>
    </header>

    <section class="hero">
        <div class="marquee-track">
            <img src="/Users/noegrimal/Documents/GRIMALAART/03_SITE/GRIMALAART_BLEU.svg" alt="">
            <img src="/Users/noegrimal/Documents/GRIMALAART/03_SITE/GRIMALAART_BLEU.svg" alt="">
            <img src="/Users/noegrimal/Documents/GRIMALAART/03_SITE/GRIMALAART_BLEU.svg" alt="">
            <img src="/Users/noegrimal/Documents/GRIMALAART/03_SITE/GRIMALAART_BLEU.svg" alt="">
            <img src="/Users/noegrimal/Documents/GRIMALAART/03_SITE/GRIMALAART_BLEU.svg" alt="">
            <img src="/Users/noegrimal/Documents/GRIMALAART/03_SITE/GRIMALAART_BLEU.svg" alt="">
        </div>
    </section>

    <main>
        <div class="work-list">
            <!-- Les posters sont générés ici par le script -->
        </div>

        <footer>
            <div class="footer-left">
                <span>NOÉ GRIMAL</span>
                <a href="https://www.instagram.com/grimalaart/" target="_blank">@GRIMALAART</a>
            </div>
            <div class="footer-right"><span>2026</span></div>
        </footer>
    </main>

    <script>
        const PRODUITS = [
            { id: "POSTER_01", nom: "POSTER_01", prix: 20, image: "/Users/noegrimal/Documents/GRIMALAART/03_SITE/IMAGES/JOUR1_SUMMER.png" },
            { id: "POSTER_02", nom: "POSTER_02", prix: 20, image: "/Users/noegrimal/Documents/GRIMALAART/03_SITE/IMAGES/JOUR2_HIVER.png" },
            { id: "POSTER_03", nom: "POSTER_03", prix: 20, image: "/Users/noegrimal/Documents/GRIMALAART/03_SITE/IMAGES/JOUR3_SUN.png" },
            { id: "POSTER_04", nom: "POSTER_04", prix: 20, image: "/Users/noegrimal/Documents/GRIMALAART/03_SITE/IMAGES/JOUR4_MOUNTAIN.png" },
            { id: "POSTER_05", nom: "POSTER_05", prix: 20, image: "/Users/noegrimal/Documents/GRIMALAART/03_SITE/IMAGES/JOUR5_TIKIS.png" },
            { id: "POSTER_06", nom: "POSTER_06", prix: 20, image: "/Users/noegrimal/Documents/GRIMALAART/03_SITE/IMAGES/JOUR6_TIKIS.png" },
            { id: "POSTER_07", nom: "POSTER_07", prix: 20, image: "/Users/noegrimal/Documents/GRIMALAART/03_SITE/IMAGES/JOUR7_TIKIS.png" },
            { id: "POSTER_08", nom: "POSTER_08", prix: 20, image: "/Users/noegrimal/Documents/GRIMALAART/03_SITE/IMAGES/JOUR8_TECKEL.png" },
        ];

        const workList = document.querySelector('.work-list');
        PRODUITS.forEach(p => {
            workList.innerHTML += `
                <div class="item">
                    <div class="img-box"><img id="img-${p.id}" src="${p.image}" alt="${p.nom}"></div>
                    <div class="desc">
                        <div class="product-info">
                            <span>${p.nom}</span>
                            <div class="product-meta">
                                <span>${p.prix}€</span>
                                <span>FORMAT A3</span>
                            </div>
                        </div>
                        <button class="add-btn" onclick="updateQuantity('${p.id}', 1)">+</button>
                    </div>
                </div>
            `;
        });

        let cart = {};

        function openCart() {
            document.getElementById('cart-panel').classList.add('open');
            document.getElementById('cart-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeCart() {
            document.getElementById('cart-panel').classList.remove('open');
            document.getElementById('cart-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function updateQuantity(id, change) {
            const prod = PRODUITS.find(p => p.id === id);
            if (cart[id]) {
                cart[id].qty += change;
            } else if (change > 0) {
                cart[id] = { nom: prod.nom, qty: 1, image: prod.image, prix: prod.prix };
            }
            if (cart[id] && cart[id].qty <= 0) delete cart[id];
            renderCart();
            if (change > 0) openCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const summary = document.getElementById('cart-summary');
            const totalValue = document.getElementById('cart-total-value');
            const keys = Object.keys(cart);

            if (keys.length === 0) {
                container.innerHTML = '<p style="text-transform:uppercase; font-style:italic; opacity:0.5;">Votre sélection est vide.</p>';
                summary.style.display = 'none';
                return;
            }

            summary.style.display = 'block';
            container.innerHTML = '';
            let total = 0;

            keys.forEach(id => {
                total += cart[id].qty * cart[id].prix;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div class="cart-item-info">
                        <img src="${cart[id].image}" class="cart-thumb">
                        <div class="cart-item-details">
                            <span>${cart[id].nom}</span>
                            <span class="format-label">${cart[id].prix}€ — FORMAT A3</span>
                        </div>
                    </div>
                    <div class="quantity-controls">
                        <button class="qty-btn" onclick="updateQuantity('${id}', -1)">-</button>
                        <span>${cart[id].qty}</span>
                        <button class="qty-btn" onclick="updateQuantity('${id}', 1)">+</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
            totalValue.innerText = total + '€';
        }
    </script>
</body>
</html>
